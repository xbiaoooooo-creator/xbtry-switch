[package]
name = "xbtry"
version = "2.3.0"
description = "XBTry: one-click Claude Code / Codex setup"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-single-instance = "=2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = "0.22"
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"


<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XBTry</title>
    <script>(function(){try{if(localStorage.getItem("cc-switch-theme:espresso")!=="1"){localStorage.setItem("cc-switch-theme","dark");localStorage.setItem("cc-switch-theme:espresso","1");}var t=localStorage.getItem("cc-switch-theme")||"dark";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
